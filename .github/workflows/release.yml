name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runs_on: '["macos-latest"]'
            builder: cargo
            target: aarch64-apple-darwin
            artifact: map-editor-macos-arm64

          - name: macOS x86_64
            runs_on: '["macos-latest"]'
            builder: cargo
            target: x86_64-apple-darwin
            artifact: map-editor-macos-x86_64

          - name: Windows x86_64
            runs_on: '["self-hosted", "linux", "x64"]'
            builder: xwin
            xwin_arch: x86_64
            target: x86_64-pc-windows-msvc
            artifact: map-editor-windows-x86_64

          - name: Windows arm64
            runs_on: '["self-hosted", "linux", "x64"]'
            builder: xwin
            xwin_arch: aarch64
            target: aarch64-pc-windows-msvc
            artifact: map-editor-windows-arm64

          - name: Linux x86_64
            runs_on: '["self-hosted", "linux", "x64"]'
            builder: cargo
            target: x86_64-unknown-linux-gnu
            artifact: map-editor-linux-x86_64

          - name: Linux arm64
            runs_on: '["self-hosted", "linux", "x64"]'
            builder: cross
            target: aarch64-unknown-linux-gnu
            artifact: map-editor-linux-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libgl1-mesa-dev

      - name: Install Windows cross-compilation dependencies
        if: matrix.builder == 'xwin'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm ninja-build cmake

      - name: Install cargo-xwin
        if: matrix.builder == 'xwin'
        run: cargo install --locked cargo-xwin

      - name: Install cross
        if: matrix.builder == 'cross'
        run: cargo install cross --locked

      - name: Build
        shell: bash
        env:
          XWIN_ACCEPT_LICENSE: 1
          XWIN_ARCH: ${{ matrix.xwin_arch }}
        run: |
          if [ "${{ matrix.builder }}" = "xwin" ]; then
            cargo xwin build --release --target ${{ matrix.target }}
          elif [ "${{ matrix.builder }}" = "cross" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package (Unix)
        if: ${{ !contains(matrix.target, 'windows-msvc') }}
        shell: bash
        run: |
          pkg_dir="${{ matrix.artifact }}-package"
          mkdir -p "$pkg_dir"
          cp "target/${{ matrix.target }}/release/map-editor" "$pkg_dir/"
          cp "maps.ron" "$pkg_dir/"
          tar -C "$pkg_dir" -czf "${{ matrix.artifact }}.tar.gz" map-editor maps.ron

      - name: Package (Windows)
        if: contains(matrix.target, 'windows-msvc')
        shell: bash
        run: |
          pkg_dir="${{ matrix.artifact }}-package"
          mkdir -p "$pkg_dir"
          cp "target/${{ matrix.target }}/release/map-editor.exe" "$pkg_dir/map-editor.exe"
          cp "maps.ron" "$pkg_dir/maps.ron"
          rm -f "${{ matrix.artifact }}.zip"
          (
            cd "$pkg_dir"
            zip -r "../${{ matrix.artifact }}.zip" .
          )

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip

  release:
    name: Publish Release
    needs: build
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            *.tar.gz
            *.zip
