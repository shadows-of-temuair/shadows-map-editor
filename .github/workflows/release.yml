name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runs_on: '["macos-latest"]'
            target: aarch64-apple-darwin
            artifact: map-editor-macos-arm64

          - name: macOS x86_64
            runs_on: '["macos-latest"]'
            target: x86_64-apple-darwin
            artifact: map-editor-macos-x86_64

          - name: Windows x86_64
            runs_on: '["windows-latest"]'
            target: x86_64-pc-windows-msvc
            artifact: map-editor-windows-x86_64

          - name: Windows arm64
            runs_on: '["windows-latest"]'
            target: aarch64-pc-windows-msvc
            artifact: map-editor-windows-arm64

          - name: Linux x86_64
            runs_on: '["self-hosted", "linux", "x64"]'
            target: x86_64-unknown-linux-gnu
            artifact: map-editor-linux-x86_64

          - name: Linux arm64
            runs_on: '["self-hosted", "linux", "x64"]'
            target: aarch64-unknown-linux-gnu
            artifact: map-editor-linux-arm64
            cross: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux' && !matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libgl1-mesa-dev

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          pkg_dir="${{ matrix.artifact }}-package"
          mkdir -p "$pkg_dir"
          cp "target/${{ matrix.target }}/release/map-editor" "$pkg_dir/"
          cp "maps.ron" "$pkg_dir/"
          tar -C "$pkg_dir" -czf "${{ matrix.artifact }}.tar.gz" map-editor maps.ron

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pkgDir = "${{ matrix.artifact }}-package"
          New-Item -ItemType Directory -Path $pkgDir -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/map-editor.exe" -Destination "$pkgDir/map-editor.exe" -Force
          Copy-Item "maps.ron" -Destination "$pkgDir/maps.ron" -Force
          if (Test-Path "${{ matrix.artifact }}.zip") {
            Remove-Item "${{ matrix.artifact }}.zip" -Force
          }
          Compress-Archive -Path "$pkgDir/*" -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip

  release:
    name: Publish Release
    needs: build
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            *.tar.gz
            *.zip
